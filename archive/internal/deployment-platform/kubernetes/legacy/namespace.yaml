apiVersion: v1
kind: Namespace
metadata:
  name: ml-portfolio
  labels:
    name: ml-portfolio
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ml-portfolio-quota
  namespace: ml-portfolio
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    requests.storage: 500Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
    services.nodeports: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ml-portfolio-limits
  namespace: ml-portfolio
spec:
  limits:
  - default:
      cpu: "2"
      memory: 4Gi
    defaultRequest:
      cpu: "0.5"
      memory: 1Gi
    type: Container
  - max:
      storage: 100Gi
    type: PersistentVolumeClaim