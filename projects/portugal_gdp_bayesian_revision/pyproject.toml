[project]
name = "portugal-gdp-bayesian-revision"
version = "0.1.0"
description = "Bayesian updating of Portugal 2025 GDP and GDP per capita using revised population information."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "jupyter>=1.0",
    "nbformat>=5.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
