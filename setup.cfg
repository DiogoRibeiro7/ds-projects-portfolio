[flake8]
max-line-length = 88
extend-ignore = E203, E266, E501, W503
exclude = .git,__pycache__,.venv,build,dist,*.egg,.tox,.mypy_cache
max-complexity = 10
per-file-ignores =
    __init__.py:F401
    test_*.py:E501

[pydocstyle]
inherit = false
match = .*\.py
match-dir = (?!(\.venv|venv|build|dist|docs/_build|htmlcov|\.mypy_cache|\.pytest_cache)).*
select = D100,D101,D102,D103,D104,D105,D106
add-ignore = D203,D213

[pylint]
max-line-length = 88
disable = C0103,C0114,C0115,C0116,R0903,R0913,W0212,R0801
good-names = i,j,k,df,ax,fig,x,y,z,_
ignored-modules = cv2,torch
generated-members = numpy.*,torch.*,cv2.*
min-similarity-lines = 10
ignore-comments = yes
ignore-docstrings = yes
ignore-imports = yes
