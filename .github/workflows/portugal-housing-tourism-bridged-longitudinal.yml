name: Portugal Housing Tourism Bridged Longitudinal

on:
  pull_request:
    branches:
      - main
    paths:
      - "projects/portugal_housing_tourism/config/sources.toml"
      - "projects/portugal_housing_tourism/scripts/build_lisbon_longitudinal.py"
      - "projects/portugal_housing_tourism/scripts/build_lisbon_bridged.py"
      - "projects/portugal_housing_tourism/results/processed/lisbon_longitudinal_legacy.csv"
      - "projects/portugal_housing_tourism/results/processed/lisbon_nuts2024_bridge_summary.csv"
      - ".github/workflows/portugal-housing-tourism-bridged-longitudinal.yml"

jobs:
  build-bridged-series:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/portugal_housing_tourism
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff==0.14.0
      - name: Show canonical formatting diff
        run: ruff format --diff scripts/build_lisbon_bridged.py
      - name: Lint
        run: ruff check scripts/build_lisbon_bridged.py
      - name: Build guarded bridged series
        run: python scripts/build_lisbon_bridged.py
      - name: Upload bridged results
        uses: actions/upload-artifact@v4
        with:
          name: portugal-housing-tourism-bridged-longitudinal
          path: |
            projects/portugal_housing_tourism/results/processed/lisbon_longitudinal_bridged.csv
            projects/portugal_housing_tourism/results/processed/lisbon_ine_bridge_provenance.csv
          if-no-files-found: error
          retention-days: 30
