[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-salary-gamma-distribution"
version = "0.1.0"
description = "Grouped-distribution modelling of Portugal salary tables."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Diogo Ribeiro" }]
dependencies = [
  "jupytext>=1.16.0",
  "jupyter>=1.0.0",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "requests>=2.31.0",
  "scipy>=1.12.0",
  "statsmodels>=0.14.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
