name: Orange Storage Decision (R)

on:
  pull_request:
    paths:
      - "projects/orange_storage_decision/**"
      - ".github/workflows/orange-storage-decision.yml"
  push:
    branches:
      - main
    paths:
      - "projects/orange_storage_decision/**"
      - ".github/workflows/orange-storage-decision.yml"
  workflow_dispatch:

jobs:
  model-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/orange_storage_decision
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run R model tests
        run: Rscript tests/test_model.R
      - name: Run out-of-time comparison tests
        run: Rscript tests/test_evaluation.R
      - name: Test price forecast sensitivity
        run: Rscript tests/test_price_sensitivity.R
      - name: Test minimax-regret policy
        run: Rscript tests/test_robust_policy.R
      - name: Test survival extrapolation stress
        run: Rscript tests/test_survival_stress.R
      - name: Test inspection error correction
        run: Rscript tests/test_inspection_error.R
      - name: Test finite inspection calibration
        run: Rscript tests/test_calibration.R
      - name: Test shared-shape survival model
        run: Rscript tests/test_shared_shape.R
      - name: Test survival model averaging
        run: Rscript tests/test_shape_ensemble.R
      - name: Test inspection budget comparisons
        run: Rscript tests/test_inspection_budget.R
      - name: Run synthetic demonstration
        run: Rscript scripts/demo.R
      - name: Evaluate paired synthetic sale policies
        run: Rscript scripts/run_policy_evaluation.R
      - name: Exercise price sensitivity report generation
        run: Rscript scripts/run_price_sensitivity.R 20 "${RUNNER_TEMP}/orange-price-sensitivity"
      - name: Exercise minimax-regret report generation
        run: Rscript scripts/run_robust_policy.R 20 "${RUNNER_TEMP}/orange-robust-policy"
      - name: Exercise survival stress report generation
        run: Rscript scripts/run_survival_stress.R 20 "${RUNNER_TEMP}/orange-survival-stress"
      - name: Exercise inspection error report generation
        run: Rscript scripts/run_inspection_error.R 20 "${RUNNER_TEMP}/orange-inspection-error"
      - name: Exercise calibration uncertainty report generation
        run: Rscript scripts/run_calibration_uncertainty.R 20 "${RUNNER_TEMP}/orange-calibration"
      - name: Exercise shared-shape report generation
        run: Rscript scripts/run_shared_shape.R 20 "${RUNNER_TEMP}/orange-shared-shape"
      - name: Exercise ensemble report generation
        run: Rscript scripts/run_shape_ensemble.R 20 "${RUNNER_TEMP}/orange-shape-ensemble"
      - name: Exercise inspection budget report generation
        run: Rscript scripts/run_inspection_budget.R 20 "${RUNNER_TEMP}/orange-inspection-budget"
