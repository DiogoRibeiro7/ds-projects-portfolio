apiVersion: v2
name: ml-portfolio
description: Production-ready ML Portfolio Platform with AutoML, Monitoring, and Cloud Integration
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - machine-learning
  - automl
  - mlops
  - data-science
  - kubernetes
home: https://github.com/yourusername/ds-portfolio
sources:
  - https://github.com/yourusername/ds-portfolio
maintainers:
  - name: ML Team
    email: ml-team@example.com
icon: https://example.com/ml-portfolio-icon.png
dependencies:
  - name: postgresql
    version: "11.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: prometheus
    version: "15.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: monitoring.prometheus.enabled
  - name: grafana
    version: "6.x.x"
    repository: https://grafana.github.io/helm-charts
    condition: monitoring.grafana.enabled