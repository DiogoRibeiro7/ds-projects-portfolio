name: Portugal Housing Tourism Lisbon Longitudinal

on:
  pull_request:
    branches:
      - main
    paths:
      - "projects/portugal_housing_tourism/scripts/build_lisbon_longitudinal.py"
      - "projects/portugal_housing_tourism/src/housing_tourism/data.py"
      - "projects/portugal_housing_tourism/config/sources.toml"
      - "projects/portugal_housing_tourism/results/processed/inside_airbnb_lisbon_annual.csv"
      - ".github/workflows/portugal-housing-tourism-lisbon-longitudinal.yml"
  push:
    branches:
      - main
    paths:
      - "projects/portugal_housing_tourism/scripts/build_lisbon_longitudinal.py"
      - "projects/portugal_housing_tourism/src/housing_tourism/data.py"
      - "projects/portugal_housing_tourism/config/sources.toml"
      - "projects/portugal_housing_tourism/results/processed/inside_airbnb_lisbon_annual.csv"
      - ".github/workflows/portugal-housing-tourism-lisbon-longitudinal.yml"

jobs:
  build-lisbon-longitudinal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/portugal_housing_tourism
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Build observed Lisbon longitudinal series
        run: python scripts/build_lisbon_longitudinal.py
      - name: Upload processed table, provenance and figures
        uses: actions/upload-artifact@v7
        with:
          name: portugal-housing-tourism-lisbon-longitudinal
          path: |
            projects/portugal_housing_tourism/results/processed/lisbon_longitudinal.csv
            projects/portugal_housing_tourism/results/processed/lisbon_ine_provenance.csv
            projects/portugal_housing_tourism/results/figures/lisbon_lhdi.png
            projects/portugal_housing_tourism/results/figures/lisbon_tourism_platform_exposure.png
          if-no-files-found: error
          retention-days: 30
