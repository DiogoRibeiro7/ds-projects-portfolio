name: Fast CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/*"
  pull_request:
    branches:
      - main
      - develop

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  fmt_lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ github.workspace }}/requirements-dev.txt
      - name: Install dependencies
        run: |
          if [ -f "${{ github.workspace }}/requirements-dev.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements-dev.txt"
          else
            echo "requirements-dev.txt not found; falling back to requirements.txt"
            pip install -r "${{ github.workspace }}/requirements.txt"
          fi
          python -m pip install ruff==0.14.0
          python -m pip install hypothesis
      - name: Check formatting consistency
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  typecheck:
    name: Type Checking
    needs: fmt_lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ github.workspace }}/requirements-dev.txt
      - name: Install dependencies
        run: |
          if [ -f "${{ github.workspace }}/requirements-dev.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements-dev.txt"
          else
            echo "requirements-dev.txt not found; falling back to requirements.txt"
            pip install -r "${{ github.workspace }}/requirements.txt"
          fi
          python -m pip install ruff==0.14.0
      - name: Run mypy
        run: make typecheck

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ github.workspace }}/requirements-dev.txt
      - name: Install dependencies
        run: |
          if [ -f "${{ github.workspace }}/requirements-dev.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements-dev.txt"
          else
            echo "requirements-dev.txt not found; falling back to requirements.txt"
            pip install -r "${{ github.workspace }}/requirements.txt"
          fi
          python -m pip install ruff==0.14.0
      - name: Run tests
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p artifacts
          make test TEST_OPTS="--junitxml=artifacts/junit-${{ matrix.python-version }}.xml --durations=25 --cov=src --cov-report=xml:artifacts/coverage-${{ matrix.python-version }}.xml --cov-report=term-missing:skip-covered"
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-artifacts-${{ matrix.python-version }}
          path: artifacts
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: artifacts/coverage-${{ matrix.python-version }}.xml

  docs:
    name: Docs Build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ github.workspace }}/requirements-dev.txt
      - name: Install dependencies
        run: |
          if [ -f "${{ github.workspace }}/requirements-dev.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements-dev.txt"
          else
            echo "requirements-dev.txt not found; falling back to requirements.txt"
            pip install -r "${{ github.workspace }}/requirements.txt"
          fi
          python -m pip install ruff==0.14.0
      - name: Build docs
        run: |
          mkdir -p docs/_build
          make docs
      - name: Upload docs build on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: docs/_build
