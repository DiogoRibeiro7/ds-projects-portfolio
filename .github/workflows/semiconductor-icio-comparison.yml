name: Semiconductor ICIO Comparison

on:
  pull_request:
    paths:
      - "projects/global_supply_chain_resilience/**"
      - ".github/workflows/semiconductor-icio-comparison.yml"
  push:
    branches: [main]
    paths:
      - "projects/global_supply_chain_resilience/**"
      - ".github/workflows/semiconductor-icio-comparison.yml"

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: projects/global_supply_chain_resilience
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Get importer evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: global-supply-chain-semiconductor-2022-concentration
          path: projects/global_supply_chain_resilience/artifacts/importer_authoritative
          repository: DiogoRibeiro7/ds-projects-portfolio
          run-id: 33417837534
          github-token: ${{ github.token }}
      - name: Get exporter evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: global-supply-chain-semiconductor-2022-exporters
          path: projects/global_supply_chain_resilience/artifacts/exporter_authoritative
          repository: DiogoRibeiro7/ds-projects-portfolio
          run-id: 33421394224
          github-token: ${{ github.token }}
      - name: Get ICIO evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: global-supply-chain-icio-2022-evidence
          path: projects/global_supply_chain_resilience/artifacts/icio_authoritative
          repository: DiogoRibeiro7/ds-projects-portfolio
          run-id: 33332046522
          github-token: ${{ github.token }}
      - name: Compare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          python scripts/run_2022_semiconductor_icio_comparison.py
          --exporters artifacts/exporter_authoritative/semiconductor_2022_exporters.csv
          --importer-links artifacts/importer_authoritative/semiconductor_2022_bilateral_links.csv
          --icio-suppliers artifacts/icio_authoritative/icio_2022_supplier_importance.csv
          --export-table-output artifacts/semiconductor_icio_comparison/export_scale.csv
          --downstream-table-output artifacts/semiconductor_icio_comparison/downstream_importance.csv
          --summary-output artifacts/semiconductor_icio_comparison/summary.json
      - name: Upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: global-supply-chain-semiconductor-2022-icio-comparison
          path: projects/global_supply_chain_resilience/artifacts/semiconductor_icio_comparison/
          if-no-files-found: error
