[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genai-rag-engineering"
version = "0.1.0"
description = "Offline-testable RAG and LLM engineering utilities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diogo Ribeiro" }]
dependencies = [
  "numpy>=1.24,<2.0",
  "pydantic>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.1.8",
]
live = [
  "anthropic>=0.34",
  "openai>=1.40",
]
retrieval = [
  "faiss-cpu>=1.8",
  "rank-bm25>=0.2",
  "sentence-transformers>=3.0",
]
service = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genai_rag_engineering"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unreachable = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
