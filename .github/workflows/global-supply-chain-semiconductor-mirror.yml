name: Global Supply Chain Semiconductor Mirror Audit

on:
  pull_request:
    paths:
      - "projects/global_supply_chain_resilience/**"
      - ".github/workflows/global-supply-chain-semiconductor-mirror.yml"
  push:
    branches:
      - main
    paths:
      - "projects/global_supply_chain_resilience/**"
      - ".github/workflows/global-supply-chain-semiconductor-mirror.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: projects/global_supply_chain_resilience

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require main for substantive execution
        if: github.event_name != 'pull_request'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Mirror audit is permitted only from main; got $GITHUB_REF." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Download authoritative importer evidence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: global-supply-chain-semiconductor-2022-concentration
          path: projects/global_supply_chain_resilience/artifacts/importer_authoritative
          github-token: ${{ github.token }}
          repository: DiogoRibeiro7/ds-projects-portfolio
          run-id: 33417837534

      - name: Run frozen top-50 mirror audit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: >-
          python scripts/run_2022_semiconductor_mirror_audit.py
          --importer-links artifacts/importer_authoritative/semiconductor_2022_bilateral_links.csv
          --output artifacts/comtrade_semiconductor_mirror/semiconductor_2022_mirror_audit.csv
          --summary-output artifacts/comtrade_semiconductor_mirror/semiconductor_2022_mirror_summary.json

      - name: Upload semiconductor mirror evidence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: global-supply-chain-semiconductor-2022-mirror-audit
          path: projects/global_supply_chain_resilience/artifacts/comtrade_semiconductor_mirror/
          if-no-files-found: error
          retention-days: 30
