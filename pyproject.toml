[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-portfolio"
version = "1.0.0"
description = "Professional data science portfolio with statistical analysis and experimentation"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]
maintainers = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = [
    "data science",
    "statistics", 
    "a/b testing",
    "experimentation",
    "machine learning",
    "analytics"
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "statsmodels>=0.14.4",
    "scikit-learn>=1.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=3.0.0"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=3.0.0",
    "black>=21.0.0",
    "isort>=5.0.0", 
    "ruff>=0.6.0",
    "mypy>=0.900",
    "pre-commit>=2.15.0",
    "nbstripout>=0.5.0"
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0"
]
viz = [
    "plotly>=5.0.0",
    "altair>=4.0.0"
]
all = [
    "ds-portfolio[dev,docs,viz]"
]

[project.urls]
Homepage = "https://github.com/diogoribeiro7/data-science-portfolio"
Documentation = "https://diogoribeiro7.github.io/data-science-portfolio/"
Repository = "https://github.com/diogoribeiro7/data-science-portfolio"
"Bug Tracker" = "https://github.com/diogoribeiro7/data-science-portfolio/issues"

[project.scripts]
ds-portfolio = "ds_portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json", "*.yaml", "*.yml"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    "*.ipynb",
    "ab_testing",
    "advanced_experimentation_platform.py",
    "analyze_experiment.py",
    "churn_prediction",
    "dashboard_enhanced",
    "deep_learning",
    "deployment",
    "docs",
    "feature_engineering",
    "modern-bank-churn",
    "nlp",
    "performance_optimization",
    "projects",
    "recommendation-system",
    "recommender_systems",
    "statistical_methods",
    "streamlit_apps",
    "tests",
    "time-series",
    "time_series",
    "tools",
    "tutorials",
    "run_tests.py",
    "run_notebook_tests.py",
    "setup.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "UP",
]
ignore = [
    "E501",
    "E722",
    "W291",
    "W293",
    "F401",
    "F403",
    "F811",
    "F821",
    "F841",
    "B006",
    "B007",
    "B019",
    "B023",
    "B028",
    "B904",
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

# mypy configuration
[tool.mypy]
python_version = "3.11"
files = ["src", "tools"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false
warn_unreachable = false
strict_equality = true
exclude = '(^|/)(ab_testing|churn_prediction|dashboard_enhanced|deep_learning|deployment|docs|feature_engineering|modern-bank-churn|nlp|performance_optimization|projects|recommendation-system|recommender_systems|statistical_methods|streamlit_apps|time-series|time_series|tutorials)/|(^|/)(deployment/model_server/app\.py|dashboard_enhanced/app\.py)$'

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "seaborn.*",
    "sklearn.*",
    "statsmodels.*",
    "plotly.*",
    "dash.*",
    "flask.*",
    "fastapi.*",
    "uvicorn.*",
    "pydantic.*",
    "sqlalchemy.*",
    "redis.*",
    "minio.*",
    "boto3.*",
    "botocore.*",
    "google.cloud.*",
    "azure.*",
    "azureml.*",
    "great_expectations.*",
    "cryptography.*",
    "jwt.*",
    "psutil.*",
    "dask.*",
    "dask_ml.*",
    "ray.*",
    "numba.*",
    "networkx.*",
    "lifelines.*",
    "prometheus_client.*",
    "scipy.*",
    "joblib.*",
    "numexpr.*",
    "shap.*",
    "imblearn.*",
    "autogluon.*",
    "featuretools.*",
    "h2o.*",
    "pycaret.*",
    "nni.*",
    "sagemaker.*",
    "fairlearn.*",
    "aif360.*",
    "diffprivlib.*",
    "cuml.*",
    "pyspark.*",
    "kafka.*",
    "opentelemetry.*",
    "bleach.*",
    "validators.*",
    "cachetools.*",
    "diskcache.*",
    "pulsar.*",
    "phonenumbers.*",
    "spacy.*",
    "creditcard.*",
    "pandera.*",
    "sweetviz.*",
    "ydata_profiling.*",
    "graphviz.*",
    "fancyimpute.*",
    "flaml.*",
    "xgboost.*",
    "cudf.*",
    "cupy.*",
    "dask_cuda.*",
    "streamlit.*",
    "uvloop.*",
]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
