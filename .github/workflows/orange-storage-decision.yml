name: Orange Storage Decision (R)

on:
  pull_request:
    paths:
      - "projects/orange_storage_decision/**"
      - ".github/workflows/orange-storage-decision.yml"
  push:
    branches:
      - main
    paths:
      - "projects/orange_storage_decision/**"
      - ".github/workflows/orange-storage-decision.yml"
  workflow_dispatch:

jobs:
  model-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/orange_storage_decision
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run R model tests
        run: Rscript tests/test_model.R
      - name: Run out-of-time comparison tests
        run: Rscript tests/test_evaluation.R
      - name: Verify original GPP SIMA CSV checksum
        run: |
          actual="$(gzip -dc data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz | sha256sum | cut -d ' ' -f 1)"
          test "$actual" = "b039f254b4fb18a41b7997208a43ceae46ee9f48db978934ab9fad6de9e24da0"
      - name: Test actual GPP SIMA orange price ingestion
        run: Rscript tests/test_sima_market_prices.R
      - name: Smoke test real SIMA CSV normalization
        run: |
          Rscript scripts/ingest_sima_orange_prices.R \
            data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz \
            "${RUNNER_TEMP}/sima-orange-normalized.csv" wholesale
      - name: Test rolling-origin SIMA forecast evaluation
        run: Rscript tests/test_sima_rolling_backtest.R
      - name: Generate out-of-time real-price evidence
        run: |
          Rscript scripts/run_sima_rolling_backtest.R \
            data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz \
            "${RUNNER_TEMP}/sima-orange-rolling-report"
      - name: Preserve real-price backtest evidence
        uses: actions/upload-artifact@v4
        with:
          name: orange-sima-rolling-backtest
          path: ${{ runner.temp }}/sima-orange-rolling-report/
          if-no-files-found: error
          retention-days: 30
      - name: Test hypothetical SIMA quotation availability
        run: Rscript tests/test_sima_availability_stress.R
      - name: Generate hypothetical publication-delay evidence
        run: |
          Rscript scripts/run_sima_availability_stress.R \
            data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz \
            "${RUNNER_TEMP}/sima-orange-availability-report"
      - name: Preserve availability-sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: orange-sima-availability-stress
          path: ${{ runner.temp }}/sima-orange-availability-report/
          if-no-files-found: error
          retention-days: 30
      - name: Test SIMA product-mix and quotation coverage
        run: Rscript tests/test_sima_composition_audit.R
      - name: Generate real-price composition evidence
        run: |
          Rscript scripts/run_sima_composition_audit.R \
            data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz \
            "${RUNNER_TEMP}/sima-orange-composition-report"
      - name: Preserve product-mix audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: orange-sima-composition-audit
          path: ${{ runner.temp }}/sima-orange-composition-report/
          if-no-files-found: error
          retention-days: 30
      - name: Test exact 52-week SIMA seasonal benchmark
        run: Rscript tests/test_sima_seasonal_benchmark.R
      - name: Generate prior-year seasonal benchmark evidence
        run: |
          Rscript scripts/run_sima_seasonal_benchmark.R \
            data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz \
            "${RUNNER_TEMP}/sima-orange-seasonal-report"
      - name: Preserve seasonal benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: orange-sima-seasonal-52-backtest
          path: ${{ runner.temp }}/sima-orange-seasonal-report/
          if-no-files-found: error
          retention-days: 30
      - name: Test SIMA year-on-year level-gap accounting
        run: Rscript tests/test_sima_level_drift_audit.R
      - name: Generate exact-panel SIMA level-drift evidence
        run: |
          Rscript scripts/run_sima_level_drift_audit.R \
            data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz \
            "${RUNNER_TEMP}/sima-orange-level-drift-report"
      - name: Preserve level-drift audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: orange-sima-level-drift-audit
          path: ${{ runner.temp }}/sima-orange-level-drift-report/
          if-no-files-found: error
          retention-days: 30
      - name: Test observed 1-4 week SIMA quote horizons
        run: Rscript tests/test_sima_forward_quote_windows.R
      - name: Generate observed SIMA forward-window evidence
        run: |
          Rscript scripts/run_sima_forward_quote_windows.R \
            data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz \
            "${RUNNER_TEMP}/sima-orange-forward-window-report"
      - name: Preserve forward-window audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: orange-sima-forward-windows
          path: ${{ runner.temp }}/sima-orange-forward-window-report/
          if-no-files-found: error
          retention-days: 30
      - name: Test hypothetical quote break-even thresholds
        run: Rscript tests/test_sima_quote_break_even.R
      - name: Generate observed-quote hypothetical break-even evidence
        run: |
          Rscript scripts/run_sima_quote_break_even.R \
            data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz \
            "${RUNNER_TEMP}/sima-orange-quote-break-even-report"
      - name: Preserve quote break-even sensitivity evidence
        uses: actions/upload-artifact@v4
        with:
          name: orange-sima-quote-break-even
          path: ${{ runner.temp }}/sima-orange-quote-break-even-report/
          if-no-files-found: error
          retention-days: 30
      - name: Test continuous hypothetical quote feasibility frontiers
        run: Rscript tests/test_sima_quote_feasibility_frontier.R
      - name: Generate continuous SIMA quote feasibility evidence
        run: |
          Rscript scripts/run_sima_quote_feasibility_frontier.R \
            data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz \
            "${RUNNER_TEMP}/sima-orange-quote-frontier-report"
      - name: Preserve continuous quote feasibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: orange-sima-quote-feasibility-frontier
          path: ${{ runner.temp }}/sima-orange-quote-frontier-report/
          if-no-files-found: error
          retention-days: 30
      - name: Test bounds for absent but elapsed future quotations
        run: Rscript tests/test_sima_missing_quote_bounds.R
      - name: Generate missing-quote identification bound report
        run: |
          Rscript scripts/run_sima_missing_quote_bounds.R \
            data/raw/sima_oranges_wholesale_2025-01-01_2026-10-31.csv.gz \
            "${RUNNER_TEMP}/sima-orange-missing-quote-report"
      - name: Preserve missing-quote identification evidence
        uses: actions/upload-artifact@v4
        with:
          name: orange-sima-missing-quote-bounds
          path: ${{ runner.temp }}/sima-orange-missing-quote-report/
          if-no-files-found: error
          retention-days: 30
      - name: Test price forecast sensitivity
        run: Rscript tests/test_price_sensitivity.R
      - name: Test minimax-regret policy
        run: Rscript tests/test_robust_policy.R
      - name: Test survival extrapolation stress
        run: Rscript tests/test_survival_stress.R
      - name: Test inspection error correction
        run: Rscript tests/test_inspection_error.R
      - name: Test finite inspection calibration
        run: Rscript tests/test_calibration.R
      - name: Test shared-shape survival model
        run: Rscript tests/test_shared_shape.R
      - name: Test survival model averaging
        run: Rscript tests/test_shape_ensemble.R
      - name: Test inspection budget comparisons
        run: Rscript tests/test_inspection_budget.R
      - name: Test destructive inspection accounting
        run: Rscript tests/test_inspection_removals.R
      - name: Test destructive inspection plan value
        run: Rscript tests/test_inspection_plan_value.R
      - name: Test adaptive inspection policy
        run: Rscript tests/test_adaptive_policy.R
      - name: Test adaptive policy under prior misspecification
        run: Rscript tests/test_adaptive_stress.R
      - name: Test adaptive policy with imperfect grading labels
        run: Rscript tests/test_adaptive_label_error.R
      - name: Test adaptive policy with finite reference calibration
        run: Rscript tests/test_adaptive_calibration_uncertainty.R
      - name: Test adaptive calibration grid-resolution sensitivity
        run: Rscript tests/test_adaptive_grid_resolution.R
      - name: Test Gaussian reference for adaptive calibration
        run: Rscript tests/test_adaptive_gauss_reference.R
      - name: Audit archived study evidence and documentation links
        run: Rscript tests/test_release_audit.R
      - name: Test frozen historical baseline
        run: Rscript tests/test_historical_baseline.R
      - name: Test uncertainty across training archives
        run: Rscript tests/test_archive_uncertainty.R
      - name: Test historical policy under shelf-life shift
        run: Rscript tests/test_historical_shift.R
      - name: Test minimax regret over survival scenarios
        run: Rscript tests/test_survival_regret.R
      - name: Run synthetic demonstration
        run: Rscript scripts/demo.R
      - name: Evaluate paired synthetic sale policies
        run: Rscript scripts/run_policy_evaluation.R
      - name: Exercise price sensitivity report generation
        run: Rscript scripts/run_price_sensitivity.R 20 "${RUNNER_TEMP}/orange-price-sensitivity"
      - name: Exercise minimax-regret report generation
        run: Rscript scripts/run_robust_policy.R 20 "${RUNNER_TEMP}/orange-robust-policy"
      - name: Exercise survival stress report generation
        run: Rscript scripts/run_survival_stress.R 20 "${RUNNER_TEMP}/orange-survival-stress"
      - name: Exercise inspection error report generation
        run: Rscript scripts/run_inspection_error.R 20 "${RUNNER_TEMP}/orange-inspection-error"
      - name: Exercise calibration uncertainty report generation
        run: Rscript scripts/run_calibration_uncertainty.R 20 "${RUNNER_TEMP}/orange-calibration"
      - name: Exercise shared-shape report generation
        run: Rscript scripts/run_shared_shape.R 20 "${RUNNER_TEMP}/orange-shared-shape"
      - name: Exercise ensemble report generation
        run: Rscript scripts/run_shape_ensemble.R 20 "${RUNNER_TEMP}/orange-shape-ensemble"
      - name: Exercise inspection budget report generation
        run: Rscript scripts/run_inspection_budget.R 20 "${RUNNER_TEMP}/orange-inspection-budget"
      - name: Exercise destructive inspection report generation
        run: Rscript scripts/run_inspection_removals.R 20 "${RUNNER_TEMP}/orange-inspection-removals"
      - name: Exercise inspection plan value report generation
        run: Rscript scripts/run_inspection_plan_value.R 20 "${RUNNER_TEMP}/orange-inspection-plan-value"
      - name: Exercise adaptive inspection report generation
        run: Rscript scripts/run_adaptive_policy.R 20 "${RUNNER_TEMP}/orange-adaptive-policy"
      - name: Exercise adaptive prior-stress report generation
        run: Rscript scripts/run_adaptive_stress.R 8 "${RUNNER_TEMP}/orange-adaptive-stress"
      - name: Exercise adaptive grading-error report generation
        run: Rscript scripts/run_adaptive_label_error.R 8 "${RUNNER_TEMP}/orange-adaptive-label-error"
      - name: Exercise adaptive finite-calibration report generation
        run: Rscript scripts/run_adaptive_calibration_uncertainty.R 6 "${RUNNER_TEMP}/orange-adaptive-calibration"
      - name: Exercise adaptive grid-resolution report generation
        run: Rscript scripts/run_adaptive_grid_resolution.R 3 "${RUNNER_TEMP}/orange-adaptive-grid-resolution"
      - name: Exercise Gaussian calibration-reference report generation
        run: Rscript scripts/run_adaptive_gauss_reference.R 2 "${RUNNER_TEMP}/orange-adaptive-gauss-reference"
      - name: Exercise historical baseline report generation
        run: Rscript scripts/run_historical_baseline.R 20 "${RUNNER_TEMP}/orange-historical-baseline"
      - name: Exercise repeated archive report generation
        run: Rscript scripts/run_archive_uncertainty.R 3 "${RUNNER_TEMP}/orange-archive-uncertainty" 10
      - name: Exercise historical shift report generation
        run: Rscript scripts/run_historical_shift.R 3 "${RUNNER_TEMP}/orange-historical-shift" 10
      - name: Exercise survival regret report generation
        run: Rscript scripts/run_survival_regret.R 3 "${RUNNER_TEMP}/orange-survival-regret" 10
