name: Adaptive Policy Learning Source Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "projects/adaptive_policy_learning/protocol/source_audit_trigger_v0_1.txt"

jobs:
  audit-official-obd:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: projects/adaptive_policy_learning

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src

      - name: Download official ZOZO Open Bandit Dataset
        run: >-
          curl --fail --location --retry 3
          --output open_bandit_dataset.zip
          https://research.zozo.com/data_release/open_bandit_dataset.zip

      - name: Audit official archive without outcome summaries
        run: >-
          python scripts/audit_obd_source.py
          --archive open_bandit_dataset.zip
          --output artifacts/source_audit/obd_source_audit.json

      - name: Freeze primary temporal split without outcomes
        run: >-
          python scripts/audit_obd_temporal_split.py
          --archive open_bandit_dataset.zip
          --output artifacts/source_audit/obd_temporal_split_audit.json

      - name: Execute Study 2 training-only qualification
        run: >-
          python scripts/run_study2_training.py
          --archive open_bandit_dataset.zip
          --output artifacts/study2/study2_training_qualification.json
          --code-sha "${{ github.sha }}"
          --protocol-dir protocol

      - name: Upload source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-policy-learning-obd-source-audit
          path: projects/adaptive_policy_learning/artifacts/source_audit/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Study 2 training qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-policy-learning-study2-training
          path: projects/adaptive_policy_learning/artifacts/study2/study2_training_qualification.json
          if-no-files-found: error
          retention-days: 30
