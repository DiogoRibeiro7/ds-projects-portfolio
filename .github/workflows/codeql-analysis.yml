name: CodeQL Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses

      - name: Check licenses
        run: |
          pip-licenses --from=mixed --format=json --output-file=licenses.json

          # Check for copyleft licenses
          python -c "
          import json
          import sys

          with open('licenses.json') as f:
              licenses = json.load(f)

          copyleft = ['GPL', 'AGPL', 'LGPL', 'EPL', 'MPL']
          found_copyleft = []

          for pkg in licenses:
              license_name = pkg.get('License', '')
              for cl in copyleft:
                  if cl in license_name:
                      found_copyleft.append(f\"{pkg['Name']}: {license_name}\")

          if found_copyleft:
              print('⚠️ Found packages with copyleft licenses:')
              for item in found_copyleft:
                  print(f'  - {item}')
              print('\\nPlease review license compatibility.')
          else:
              print('✅ No copyleft licenses found.')
          "

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json