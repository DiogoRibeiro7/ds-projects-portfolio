name: Mobility empirical backtest

on:
  pull_request:
    paths:
      - "projects/mobility_demand_optimization/**"
      - ".github/workflows/mobility_empirical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobility-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        working-directory: projects/mobility_demand_optimization
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mobility unit tests
        working-directory: projects/mobility_demand_optimization
        run: python -m pytest -q

      - name: Build frozen TLC panel
        working-directory: projects/mobility_demand_optimization
        run: python scripts/build_tlc_panel.py --download

      - name: Run frozen forecasting baselines
        working-directory: projects/mobility_demand_optimization
        run: python scripts/run_baselines.py

      - name: Calibrate probabilistic count model
        working-directory: projects/mobility_demand_optimization
        run: python scripts/run_probabilistic_counts.py

      - name: Run fleet-allocation decision backtest
        working-directory: projects/mobility_demand_optimization
        run: python scripts/run_allocation.py

      - name: Run spatial relocation-cost sensitivity
        working-directory: projects/mobility_demand_optimization
        run: python scripts/run_spatial_allocation.py

      - name: Run rolling fleet-state sensitivity
        working-directory: projects/mobility_demand_optimization
        run: python scripts/run_rolling_allocation.py

      - name: Run duration-aware fleet-state sensitivity
        working-directory: projects/mobility_demand_optimization
        run: python scripts/run_duration_aware_allocation.py

      - name: Align decision headline summaries
        working-directory: projects/mobility_demand_optimization
        run: python scripts/align_headline_summaries.py

      - name: Print empirical summaries
        working-directory: projects/mobility_demand_optimization
        run: |
          cat data/results/baselines/summary.json
          cat data/results/probabilistic_counts/summary.json
          cat data/results/allocation/summary.json
          cat data/results/spatial_allocation/summary.json
          cat data/results/rolling_allocation/summary.json
          cat data/results/duration_aware_allocation/summary.json

      - name: Upload processed evidence
        uses: actions/upload-artifact@v7
        with:
          name: mobility-empirical-backtest
          if-no-files-found: error
          retention-days: 14
          path: |
            projects/mobility_demand_optimization/data/processed/mobility_demand_hourly.manifest.json
            projects/mobility_demand_optimization/data/results/baselines/summary.json
            projects/mobility_demand_optimization/data/results/baselines/*.parquet
            projects/mobility_demand_optimization/data/results/probabilistic_counts/summary.json
            projects/mobility_demand_optimization/data/results/probabilistic_counts/*.csv
            projects/mobility_demand_optimization/data/results/allocation/summary.json
            projects/mobility_demand_optimization/data/results/allocation/*.csv
            projects/mobility_demand_optimization/data/results/spatial_allocation/summary.json
            projects/mobility_demand_optimization/data/results/spatial_allocation/*.csv
            projects/mobility_demand_optimization/data/results/rolling_allocation/summary.json
            projects/mobility_demand_optimization/data/results/rolling_allocation/*.csv
            projects/mobility_demand_optimization/data/results/duration_aware_allocation/summary.json
            projects/mobility_demand_optimization/data/results/duration_aware_allocation/*.csv
