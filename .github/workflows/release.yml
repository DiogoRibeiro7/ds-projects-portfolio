name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer (e.g., 1.2.3)"
        required: true

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run checks
        run: |
          make check
          make docs

      - name: Verify version + changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Verifying ${VERSION}"
          grep -q "version = \"${VERSION}\"" pyproject.toml || { echo 'pyproject version mismatch'; exit 1; }
          grep -q "## \[${VERSION}\]" CHANGELOG.md || { echo 'CHANGELOG missing entry'; exit 1; }

      - name: Build artifacts
        run: make build

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ github.event.inputs.version }}
          path: dist

      - name: Create git tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          body: |
            Release v${{ github.event.inputs.version }}

            See CHANGELOG for details.
          files: |
            dist/*.tar.gz
            dist/*.whl
