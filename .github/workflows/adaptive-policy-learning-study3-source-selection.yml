name: Adaptive Policy Learning Study 3 Source Selection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "projects/adaptive_policy_learning/protocol/study3_source_selection_trigger_v2_0.txt"

jobs:
  select-study3-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: projects/adaptive_policy_learning

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src

      - name: Download official ZOZO Open Bandit Dataset
        run: >-
          curl --fail --location --retry 3
          --output open_bandit_dataset.zip
          https://research.zozo.com/data_release/open_bandit_dataset.zip

      - name: Verify archive against frozen source lock
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          archive = Path("open_bandit_dataset.zip")
          source_lock = json.loads(Path("protocol/obd_source_lock.json").read_text(encoding="utf-8"))
          expected = str(source_lock["archive"]["sha256"])
          with archive.open("rb") as handle:
              actual = hashlib.file_digest(handle, "sha256").hexdigest()
          if actual != expected:
              raise SystemExit(f"archive SHA256 mismatch: expected {expected}, got {actual}")
          print(f"verified archive SHA256 {actual}")
          PY

      - name: Audit Men's campaign without parsing clicks
        run: >-
          python scripts/audit_obd_source.py
          --archive open_bandit_dataset.zip
          --campaign men
          --skip-click-validation
          --output artifacts/study3_source/men_source_audit.json

      - name: Audit Women's campaign without parsing clicks
        run: >-
          python scripts/audit_obd_source.py
          --archive open_bandit_dataset.zip
          --campaign women
          --skip-click-validation
          --output artifacts/study3_source/women_source_audit.json

      - name: Apply frozen Study 3 source-selection rule
        run: >-
          python scripts/select_study3_campaign.py
          --men artifacts/study3_source/men_source_audit.json
          --women artifacts/study3_source/women_source_audit.json
          --source-lock protocol/obd_source_lock.json
          --code-sha "${{ github.sha }}"
          --output artifacts/study3_source/study3_source_selection.json

      - name: Upload Study 3 source-selection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-policy-learning-study3-source-selection
          path: projects/adaptive_policy_learning/artifacts/study3_source/
          if-no-files-found: error
          retention-days: 30
