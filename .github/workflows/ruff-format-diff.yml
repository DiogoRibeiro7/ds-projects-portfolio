name: Ruff Format Diff

on:
  pull_request:
    branches:
      - main

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.14.0
      - name: Show formatter diff
        run: |
          ruff format --diff \
            projects/portugal_housing_tourism/src/housing_tourism/data.py \
            projects/portugal_housing_tourism/src/housing_tourism/rnal.py
