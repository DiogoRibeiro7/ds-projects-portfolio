
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: genai-service
  template:
    metadata:
      labels:
        app: genai-service
    spec:
      containers:
      - name: app
        image: genai-service:latest
        ports:
        - containerPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: genai-service-hpa
spec:
  minReplicas: 3
  maxReplicas: 12
