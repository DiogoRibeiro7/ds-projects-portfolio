name: Dependency Update

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 8 AM
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade "pip<24.2"
          pip install "pip-tools>=7.4.1"

      - name: Update requirements
        run: |
          # Compile requirements from setup.py or pyproject.toml
          pip-compile --upgrade --resolver=backtracking

          # Update test requirements
          pip-compile requirements-test.in --upgrade --resolver=backtracking -o requirements-test.txt

          # Update dev requirements
          pip-compile requirements-dev.in --upgrade --resolver=backtracking -o requirements-dev.txt

      - name: Test updated dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pytest tests/ --maxfail=5 -q

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'Automated dependency updates'
          body: |
            ## Automated Dependency Updates

            This PR contains automated dependency updates generated by pip-compile.

            ### Changes
            - Updated production dependencies in `requirements.txt`
            - Updated test dependencies in `requirements-test.txt`
            - Updated development dependencies in `requirements-dev.txt`

            ### Testing
            - ✅ All tests pass with updated dependencies
            - ⚠️ Please review changes carefully before merging

            ### Security
            Run security checks before merging:
            ```bash
            pip-audit
            safety check
            ```
          branch: automated-dependency-updates
          labels: dependencies, automated

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit "safety<3"

      - name: Run pip-audit
        run: |
          pip-audit --desc --format json --output pip-audit-report.json
          cat pip-audit-report.json

      - name: Run safety check
        run: |
          safety check --json --output safety-report.json
          cat safety-report.json

      - name: Check for critical vulnerabilities
        run: |
          python -c "
          import json
          import sys

          # Check pip-audit report
          with open('pip-audit-report.json') as f:
              audit_data = json.load(f)
              if audit_data.get('vulnerabilities'):
                  print('Critical vulnerabilities found in pip-audit!')
                  for vuln in audit_data['vulnerabilities']:
                      print(f\"  - {vuln.get('name')}: {vuln.get('description')}\")
                  sys.exit(1)

          print('No critical vulnerabilities found.')
          "
