name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test,notebook]"
      - name: Test
        run: pytest
      - name: Validate notebook JSON
        run: python -c "import nbformat; nbformat.read('notebooks/customer_retention_uplift_modeling.ipynb', as_version=4)"
