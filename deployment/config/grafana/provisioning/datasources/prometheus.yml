# Grafana Datasource Configuration
apiVersion: 1

# List of datasources to insert/update depending on what's available in the database
datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: "15s"
      queryTimeout: "60s"
      exemplarTraceIdDestinations:
        - datasourceUid: jaeger
          name: trace_id
    editable: true

  # Elasticsearch datasource for logs
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    orgId: 1
    url: http://elasticsearch:9200
    database: "[logstash-]YYYY.MM.DD"
    basicAuth: false
    jsonData:
      esVersion: "7.15.0"
      includeFrozen: false
      logLevelField: "level"
      logMessageField: "message"
      maxConcurrentShardRequests: 5
      timeField: "@timestamp"
    editable: true

  # Jaeger datasource for tracing
  - name: Jaeger
    type: jaeger
    access: proxy
    orgId: 1
    url: http://jaeger:16686
    basicAuth: false
    jsonData:
      tracesToLogs:
        datasourceUid: elasticsearch
        tags: ['job', 'instance']
        mappedTags: [{ key: 'service.name', value: 'service' }]
        mapTagNamesEnabled: true
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
    editable: true

  # PostgreSQL datasource for MLflow metrics
  - name: PostgreSQL
    type: postgres
    access: proxy
    orgId: 1
    url: postgres:5432
    database: mlflow
    user: mlflow
    secureJsonData:
      password: mlflow
    jsonData:
      sslmode: 'disable'
      maxOpenConns: 0
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1300
      timescaledb: false
    editable: true

  # Redis datasource (requires redis-datasource plugin)
  - name: Redis
    type: redis-datasource
    access: proxy
    orgId: 1
    url: redis://redis:6379
    jsonData:
      client: standalone
    editable: true