apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ml-portfolio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ml-portfolio
  labels:
    app: postgres
    component: database
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:14-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ml-portfolio-secrets
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ml-portfolio-secrets
              key: DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: ml-portfolio-config
              key: DB_NAME
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF8 --locale=en_US.UTF-8"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: postgres-config
        configMap:
          name: postgres-init-config
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ml-portfolio
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: ml-portfolio
data:
  init.sql: |
    -- Create extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    -- Create schemas
    CREATE SCHEMA IF NOT EXISTS ml_models;
    CREATE SCHEMA IF NOT EXISTS ml_experiments;
    CREATE SCHEMA IF NOT EXISTS ml_features;

    -- Create tables
    CREATE TABLE IF NOT EXISTS ml_models.models (
        model_id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        model_name VARCHAR(255) NOT NULL,
        model_version VARCHAR(50) NOT NULL,
        model_type VARCHAR(100),
        framework VARCHAR(50),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        metadata JSONB,
        performance_metrics JSONB,
        model_path TEXT,
        status VARCHAR(50) DEFAULT 'inactive',
        UNIQUE(model_name, model_version)
    );

    CREATE TABLE IF NOT EXISTS ml_experiments.experiments (
        experiment_id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        experiment_name VARCHAR(255) NOT NULL,
        start_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        end_time TIMESTAMP,
        status VARCHAR(50),
        parameters JSONB,
        metrics JSONB,
        artifacts JSONB,
        tags TEXT[],
        created_by VARCHAR(100)
    );

    CREATE TABLE IF NOT EXISTS ml_features.feature_store (
        feature_id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        feature_name VARCHAR(255) NOT NULL,
        feature_type VARCHAR(50),
        description TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        statistics JSONB,
        importance_score FLOAT,
        tags TEXT[]
    );

    -- Create indexes
    CREATE INDEX idx_models_status ON ml_models.models(status);
    CREATE INDEX idx_models_created ON ml_models.models(created_at DESC);
    CREATE INDEX idx_experiments_status ON ml_experiments.experiments(status);
    CREATE INDEX idx_experiments_tags ON ml_experiments.experiments USING GIN(tags);
    CREATE INDEX idx_features_tags ON ml_features.feature_store USING GIN(tags);

    -- Create views
    CREATE OR REPLACE VIEW ml_models.active_models AS
    SELECT * FROM ml_models.models WHERE status = 'active';

    CREATE OR REPLACE VIEW ml_experiments.recent_experiments AS
    SELECT * FROM ml_experiments.experiments
    WHERE start_time > CURRENT_TIMESTAMP - INTERVAL '7 days'
    ORDER BY start_time DESC;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ml-portfolio
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        command:
        - redis-server
        - --requirepass
        - $(REDIS_PASSWORD)
        - --appendonly
        - "yes"
        - --maxmemory
        - "2gb"
        - --maxmemory-policy
        - "allkeys-lru"
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ml-portfolio-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "1Gi"
            cpu: "0.5"
          limits:
            memory: "2Gi"
            cpu: "1"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - --pass
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - --pass
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: ml-portfolio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: ml-portfolio
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP