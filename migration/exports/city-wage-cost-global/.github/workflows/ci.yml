name: CI

on:
  push:
  pull_request:

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(Path("notebooks").glob("*.ipynb"))
          if len(notebooks) != 4:
              raise SystemExit(f"Expected 4 notebooks, found {len(notebooks)}")
          for notebook in notebooks:
              with notebook.open(encoding="utf-8") as handle:
                  json.load(handle)
          print(f"Validated {len(notebooks)} notebooks")
          PY
      - name: Import dependency smoke test
        run: |
          python - <<'PY'
          import eurostat
          import matplotlib
          import nbformat
          import numpy
          import openpyxl
          import pandas
          import pyarrow
          import requests

          print("dependency imports ok")
          PY
