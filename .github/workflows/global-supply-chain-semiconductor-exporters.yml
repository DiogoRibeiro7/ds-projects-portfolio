name: Global Supply Chain Semiconductor Exporters

on:
  pull_request:
    paths:
      - "projects/global_supply_chain_resilience/**"
      - ".github/workflows/global-supply-chain-semiconductor-exporters.yml"
  push:
    branches:
      - main
    paths:
      - "projects/global_supply_chain_resilience/**"
      - ".github/workflows/global-supply-chain-semiconductor-exporters.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: projects/global_supply_chain_resilience

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require main for substantive execution
        if: github.event_name != 'pull_request'
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Exporter diagnostics are permitted only from main; got $GITHUB_REF." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Download authoritative importer evidence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: global-supply-chain-semiconductor-2022-concentration
          path: projects/global_supply_chain_resilience/artifacts/importer_authoritative
          github-token: ${{ github.token }}
          repository: DiogoRibeiro7/ds-projects-portfolio
          run-id: 33417837534

      - name: Run frozen 2022 HS 8542 exporter diagnostics
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: >-
          python scripts/run_2022_semiconductor_exporter_diagnostics.py
          --reporter-lock protocol/semiconductor_reporter_lock_2022.json
          --importer-metrics artifacts/importer_authoritative/semiconductor_2022_importer_metrics.csv
          --importer-links artifacts/importer_authoritative/semiconductor_2022_bilateral_links.csv
          --exporters-output artifacts/comtrade_semiconductor_exporters/semiconductor_2022_exporters.csv
          --suppliers-output artifacts/comtrade_semiconductor_exporters/semiconductor_2022_supplier_diagnostics.csv
          --summary-output artifacts/comtrade_semiconductor_exporters/semiconductor_2022_exporter_summary.json

      - name: Upload semiconductor exporter evidence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: global-supply-chain-semiconductor-2022-exporters
          path: projects/global_supply_chain_resilience/artifacts/comtrade_semiconductor_exporters/
          if-no-files-found: error
          retention-days: 30
