[project]
name = "portugal-gdp-bayesian-revision"
version = "0.1.0"
description = "Vintage reconciliation and Bayesian modelling of Portugal's 2025 GDP-per-capita revision."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "requests>=2.31",
    "jupyter>=1.0",
    "nbformat>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
