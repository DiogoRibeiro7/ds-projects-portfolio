# Logstash Pipeline Configuration for ML Platform

input {
  # Collect logs from model server applications
  tcp {
    port => 5000
    codec => json_lines
    type => "model-server"
    tags => ["ml", "model-server"]
  }

  # Collect metrics from StatsD
  udp {
    port => 8125
    codec => plain
    type => "statsd"
    tags => ["metrics", "statsd"]
  }

  # Collect logs from Docker containers
  tcp {
    port => 5001
    codec => json
    type => "docker"
    tags => ["docker", "container"]
  }

  # Collect Filebeat logs
  beats {
    port => 5044
    type => "filebeat"
    codec => plain
  }

  # Collect application logs via HTTP
  http {
    port => 8080
    codec => json
    type => "http-logs"
    tags => ["http", "api"]
  }

  # Kafka input for distributed logging
  # kafka {
  #   bootstrap_servers => "kafka:9092"
  #   topics => ["ml-logs", "ml-metrics", "ml-events"]
  #   group_id => "logstash-consumer"
  #   codec => json
  #   type => "kafka"
  # }
}

filter {
  # Parse JSON logs
  if [type] == "model-server" {
    json {
      source => "message"
      target => "parsed"
    }

    # Extract specific fields
    mutate {
      add_field => {
        "model_name" => "%{[parsed][model_name]}"
        "model_version" => "%{[parsed][model_version]}"
        "request_id" => "%{[parsed][request_id]}"
        "latency_ms" => "%{[parsed][latency_ms]}"
        "log_level" => "%{[parsed][level]}"
      }
    }

    # Parse timestamp
    date {
      match => [ "[parsed][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }

    # Add GeoIP information if IP is available
    if [parsed][client_ip] {
      geoip {
        source => "[parsed][client_ip]"
        target => "geoip"
        database => "/usr/share/logstash/GeoLite2-City.mmdb"
      }
    }
  }

  # Parse Docker logs
  if [type] == "docker" {
    json {
      source => "message"
    }

    # Extract container information
    mutate {
      add_field => {
        "container_id" => "%{[container][id]}"
        "container_name" => "%{[container][name]}"
        "container_image" => "%{[container][image]}"
      }
    }

    # Parse Docker timestamp
    date {
      match => [ "time", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # Parse StatsD metrics
  if [type] == "statsd" {
    grok {
      match => {
        "message" => "%{WORD:metric_name}:%{NUMBER:metric_value:float}\|%{WORD:metric_type}(?:\|@%{NUMBER:sample_rate:float})?(?:\|#%{DATA:tags})?"
      }
    }

    # Parse tags
    if [tags] {
      ruby {
        code => "
          tags_hash = {}
          event.get('tags').split(',').each do |tag|
            k, v = tag.split(':')
            tags_hash[k] = v if k && v
          end
          event.set('parsed_tags', tags_hash)
        "
      }
    }

    # Add metric type information
    mutate {
      add_field => {
        "metric_category" => "statsd"
      }
    }
  }

  # Parse application errors
  if [parsed][level] == "ERROR" or [log_level] == "ERROR" {
    mutate {
      add_tag => [ "error", "alert" ]
      add_field => {
        "alert_severity" => "high"
      }
    }

    # Extract error details
    if [parsed][error] {
      mutate {
        add_field => {
          "error_type" => "%{[parsed][error][type]}"
          "error_message" => "%{[parsed][error][message]}"
          "error_stack" => "%{[parsed][error][stack_trace]}"
        }
      }
    }
  }

  # Parse prediction requests
  if [parsed][event_type] == "prediction_request" {
    mutate {
      add_field => {
        "prediction_model" => "%{[parsed][model_name]}"
        "prediction_version" => "%{[parsed][model_version]}"
        "prediction_latency" => "%{[parsed][latency_ms]}"
        "prediction_status" => "%{[parsed][status]}"
      }
    }

    # Calculate SLA compliance
    ruby {
      code => "
        latency = event.get('prediction_latency').to_f
        sla_target = 1000.0  # 1 second SLA
        event.set('sla_compliant', latency <= sla_target)
        event.set('sla_breach_ms', [0, latency - sla_target].max)
      "
    }
  }

  # Enrich with environment information
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:production}"
      "cluster" => "${CLUSTER_NAME:ml-cluster}"
      "region" => "${AWS_REGION:us-west-2}"
    }
  }

  # Parse user agent if present
  if [parsed][user_agent] {
    useragent {
      source => "[parsed][user_agent]"
      target => "user_agent_parsed"
    }
  }

  # Add data classification
  if [parsed][data_sensitivity] {
    mutate {
      add_field => {
        "data_classification" => "%{[parsed][data_sensitivity]}"
      }
    }

    # Mask sensitive data
    if [data_classification] == "PII" or [data_classification] == "sensitive" {
      mutate {
        gsub => [
          "message", "\b(?:\d{3}-\d{2}-\d{4})\b", "XXX-XX-XXXX",  # SSN
          "message", "\b(?:\d{4}[\s-]?){3}\d{4}\b", "XXXX-XXXX-XXXX-XXXX",  # Credit card
          "message", "\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b", "***@***.***"  # Email
        ]
      }
    }
  }

  # Calculate metrics
  if [type] == "model-server" and [parsed][metrics] {
    ruby {
      code => "
        metrics = event.get('[parsed][metrics]')
        if metrics
          # Calculate average, min, max from metrics array
          if metrics.is_a?(Array) && !metrics.empty?
            event.set('metrics_avg', metrics.sum.to_f / metrics.size)
            event.set('metrics_min', metrics.min)
            event.set('metrics_max', metrics.max)
            event.set('metrics_count', metrics.size)
          end
        end
      "
    }
  }

  # Add fingerprint for deduplication
  fingerprint {
    source => ["message", "host", "type"]
    target => "[@metadata][fingerprint]"
    method => "SHA256"
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "port", "@version" ]
  }

  # Add processing timestamp
  ruby {
    code => "event.set('processed_at', Time.now.utc.iso8601)"
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ml-logs-%{[type]}-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][fingerprint]}"
    template_name => "ml-logs"
    template => "/usr/share/logstash/templates/ml-logs.json"
    template_overwrite => true
  }

  # Output metrics to InfluxDB (if available)
  # influxdb {
  #   host => "influxdb"
  #   port => 8086
  #   db => "ml_metrics"
  #   measurement => "%{metric_name}"
  #   codec => json
  #   use_event_fields_for_data_points => true
  #   exclude_fields => ["@timestamp", "@version", "host"]
  #   time_field => "@timestamp"
  #   time_precision => "ms"
  # }

  # Output errors to dedicated index
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "ml-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }

    # Send alerts for critical errors
    if [alert_severity] == "critical" {
      email {
        to => "ml-team@example.com"
        from => "logstash@example.com"
        subject => "Critical Error in ML Platform"
        body => "Error Details:\n\nModel: %{model_name}\nVersion: %{model_version}\nError: %{error_message}\nTimestamp: %{@timestamp}\nRequest ID: %{request_id}"
        address => "smtp.example.com"
        port => 587
        username => "logstash@example.com"
        password => "${SMTP_PASSWORD}"
        use_tls => true
      }
    }
  }

  # Output to S3 for long-term storage
  # s3 {
  #   region => "us-west-2"
  #   bucket => "ml-logs-archive"
  #   prefix => "logs/%{[type]}/%{+YYYY/MM/dd}/"
  #   time_file => 60
  #   codec => json_lines
  #   canned_acl => "private"
  #   server_side_encryption => true
  #   server_side_encryption_algorithm => "AES256"
  # }

  # Output to Kafka for streaming analytics
  # kafka {
  #   bootstrap_servers => "kafka:9092"
  #   topic_id => "ml-processed-logs"
  #   codec => json
  #   acks => "1"
  #   retries => 3
  #   compression_type => "snappy"
  # }

  # Debug output (remove in production)
  if [type] == "debug" or "debug" in [tags] {
    stdout {
      codec => rubydebug
    }
  }

  # Output metrics to Prometheus pushgateway
  if [type] == "statsd" {
    http {
      url => "http://pushgateway:9091/metrics/job/logstash/instance/%{host}"
      http_method => "post"
      format => "message"
      message => "%{metric_name}{type=\"%{metric_type}\"} %{metric_value}"
    }
  }
}