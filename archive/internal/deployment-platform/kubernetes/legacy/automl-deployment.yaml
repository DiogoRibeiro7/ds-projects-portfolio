apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: automl-ray-head
  namespace: ml-portfolio
  labels:
    app: automl-ray-head
    component: automl
    ray-node-type: head
spec:
  serviceName: ray-head-service
  replicas: 1
  selector:
    matchLabels:
      app: automl-ray-head
  template:
    metadata:
      labels:
        app: automl-ray-head
        component: automl
        ray-node-type: head
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8265"
    spec:
      serviceAccountName: automl-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ray-head
        image: your-registry/ds-portfolio-automl:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c", "--"]
        args:
          - |
            ray start --head \
              --port=6379 \
              --dashboard-port=8265 \
              --dashboard-host=0.0.0.0 \
              --num-cpus=$RAY_NUM_CPUS \
              --num-gpus=$RAY_NUM_GPUS \
              --block
        ports:
        - containerPort: 6379
          name: ray-head
        - containerPort: 8265
          name: dashboard
        - containerPort: 10001
          name: client
        - containerPort: 8000
          name: serve
        env:
        - name: RAY_NUM_CPUS
          value: "8"
        - name: RAY_NUM_GPUS
          value: "1"
        - name: RAY_memory
          value: "16000000000"  # 16GB
        - name: RAY_object_store_memory
          value: "8000000000"   # 8GB
        envFrom:
        - configMapRef:
            name: ml-portfolio-config
        - secretRef:
            name: ml-portfolio-secrets
        resources:
          requests:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "16Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - ray status
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: ray-logs
          mountPath: /tmp/ray
        - name: model-storage
          mountPath: /app/models
        - name: shared-memory
          mountPath: /dev/shm
      volumes:
      - name: shared-memory
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
  volumeClaimTemplates:
  - metadata:
      name: ray-logs
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
  - metadata:
      name: model-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automl-ray-worker
  namespace: ml-portfolio
  labels:
    app: automl-ray-worker
    component: automl
    ray-node-type: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: automl-ray-worker
  template:
    metadata:
      labels:
        app: automl-ray-worker
        component: automl
        ray-node-type: worker
    spec:
      serviceAccountName: automl-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: wait-for-ray-head
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z ray-head-service 6379; do echo waiting for ray head; sleep 2; done;']
      containers:
      - name: ray-worker
        image: your-registry/ds-portfolio-automl:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c", "--"]
        args:
          - |
            ray start \
              --address=ray-head-service:6379 \
              --num-cpus=$RAY_NUM_CPUS \
              --num-gpus=$RAY_NUM_GPUS \
              --block
        env:
        - name: RAY_NUM_CPUS
          value: "4"
        - name: RAY_NUM_GPUS
          value: "1"
        - name: RAY_memory
          value: "8000000000"  # 8GB
        envFrom:
        - configMapRef:
            name: ml-portfolio-config
        - secretRef:
            name: ml-portfolio-secrets
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: ray-logs
          mountPath: /tmp/ray
        - name: shared-memory
          mountPath: /dev/shm
      volumes:
      - name: ray-logs
        emptyDir: {}
      - name: shared-memory
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      nodeSelector:
        accelerator: nvidia-tesla-t4
---
apiVersion: v1
kind: Service
metadata:
  name: ray-head-service
  namespace: ml-portfolio
  labels:
    app: automl-ray-head
spec:
  type: ClusterIP
  selector:
    app: automl-ray-head
  ports:
  - port: 6379
    targetPort: 6379
    name: ray-head
  - port: 8265
    targetPort: 8265
    name: dashboard
  - port: 10001
    targetPort: 10001
    name: client
  - port: 8000
    targetPort: 8000
    name: serve
---
apiVersion: v1
kind: Service
metadata:
  name: ray-dashboard
  namespace: ml-portfolio
  labels:
    app: automl-ray-head
spec:
  type: LoadBalancer
  selector:
    app: automl-ray-head
  ports:
  - port: 8265
    targetPort: 8265
    name: dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: automl-sa
  namespace: ml-portfolio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: automl-role
  namespace: ml-portfolio
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: automl-rolebinding
  namespace: ml-portfolio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: automl-role
subjects:
- kind: ServiceAccount
  name: automl-sa
  namespace: ml-portfolio