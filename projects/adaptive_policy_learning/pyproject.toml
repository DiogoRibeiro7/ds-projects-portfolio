[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-policy-learning"
version = "0.1.0"
description = "Off-policy evaluation and conservative contextual policy selection"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/adaptive_policy_learning/empirical.py" = ["I001", "UP035", "C408"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "adaptive_policy_learning.empirical"
disable_error_code = ["arg-type", "import-untyped"]

[[tool.mypy.overrides]]
module = "adaptive_policy_learning.optimizer_v08"
disable_error_code = ["attr-defined"]
