groups:
  - name: ml_api_alerts
    interval: 30s
    rules:
      # High Error Rate
      - alert: MLAPIHighErrorRate
        expr: |
          rate(ml_api_requests_total{status="error"}[5m])
          / rate(ml_api_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: ml-api
        annotations:
          summary: "High error rate on ML API"
          description: "ML API error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      # High Latency
      - alert: MLAPIHighLatency
        expr: |
          histogram_quantile(0.99, rate(ml_api_request_latency_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          component: ml-api
        annotations:
          summary: "High latency on ML API"
          description: "ML API p99 latency is {{ $value }}s over the last 5 minutes"

      # Low Prediction Throughput
      - alert: MLAPILowThroughput
        expr: |
          rate(ml_api_predictions_total[5m]) < 10
        for: 10m
        labels:
          severity: warning
          component: ml-api
        annotations:
          summary: "Low prediction throughput"
          description: "Prediction rate is {{ $value }}/s, below expected threshold"

      # Model Not Loaded
      - alert: NoModelsLoaded
        expr: ml_api_active_models == 0
        for: 2m
        labels:
          severity: critical
          component: ml-api
        annotations:
          summary: "No models loaded in ML API"
          description: "ML API has no active models loaded"

  - name: infrastructure_alerts
    interval: 30s
    rules:
      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

      # Pod Restart Loop
      - alert: PodRestartLoop
        expr: |
          rate(kube_pod_container_status_restarts_total[15m]) > 0.5
        for: 5m
        labels:
          severity: critical
          component: kubernetes
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restart looping"
          description: "Pod has restarted {{ $value }} times in the last 15 minutes"

  - name: database_alerts
    interval: 30s
    rules:
      # Database Connection Pool Exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          pg_stat_database_numbackends / pg_settings_max_connections > 0.9
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "{{ $value | humanizePercentage }} of connections are in use"

      # Database Slow Queries
      - alert: DatabaseSlowQueries
        expr: |
          rate(pg_stat_statements_mean_time_seconds[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database queries are slow"
          description: "Average query time is {{ $value }}s"

      # Redis Memory Usage High
      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using {{ $value | humanizePercentage }} of available memory"

  - name: automl_alerts
    interval: 30s
    rules:
      # Ray Cluster Unhealthy
      - alert: RayClusterUnhealthy
        expr: |
          ray_cluster_active_nodes < ray_cluster_total_nodes
        for: 5m
        labels:
          severity: critical
          component: automl
        annotations:
          summary: "Ray cluster is unhealthy"
          description: "Only {{ $value }} out of {{ $labels.total_nodes }} Ray nodes are active"

      # AutoML Training Stuck
      - alert: AutoMLTrainingStuck
        expr: |
          increase(automl_models_trained_total[30m]) == 0
          and automl_training_active > 0
        for: 30m
        labels:
          severity: warning
          component: automl
        annotations:
          summary: "AutoML training appears stuck"
          description: "No new models trained in the last 30 minutes despite active training"

      # GPU Utilization Low
      - alert: GPUUtilizationLow
        expr: |
          nvidia_smi_utilization_gpu_ratio < 0.2
        for: 15m
        labels:
          severity: info
          component: automl
        annotations:
          summary: "GPU utilization is low"
          description: "GPU {{ $labels.gpu }} is only {{ $value | humanizePercentage }} utilized"

  - name: data_quality_alerts
    interval: 60s
    rules:
      # Data Drift Detected
      - alert: DataDriftDetected
        expr: |
          data_drift_score > 0.1
        for: 10m
        labels:
          severity: warning
          component: data-quality
        annotations:
          summary: "Data drift detected in {{ $labels.feature }}"
          description: "Drift score is {{ $value }}, above threshold"

      # Missing Features
      - alert: MissingFeatures
        expr: |
          feature_missing_rate > 0.05
        for: 5m
        labels:
          severity: warning
          component: data-quality
        annotations:
          summary: "High rate of missing features"
          description: "{{ $value | humanizePercentage }} of features are missing"

      # Model Performance Degradation
      - alert: ModelPerformanceDegradation
        expr: |
          model_performance_auc < 0.7
        for: 15m
        labels:
          severity: critical
          component: ml-model
        annotations:
          summary: "Model {{ $labels.model }} performance degraded"
          description: "Model AUC is {{ $value }}, below acceptable threshold"