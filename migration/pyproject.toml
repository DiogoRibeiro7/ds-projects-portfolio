[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
  "exports",
  "templates",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = "^(migration/exports|migration/templates)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
  "exports",
  "templates",
]
