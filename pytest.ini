[pytest]
# Pytest configuration for Data Science Portfolio

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum coverage threshold
addopts =
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=0
    --strict-markers
    --tb=short
    -v
    --maxfail=3
    --benchmark-disable
    --hypothesis-show-statistics

# Custom markers
markers =
    unit: Fast, deterministic tests for pure functions or isolated classes
    integration: Multi-component flows with external systems mocked/faked
    slow: Long running tests (excluded from default suite)
    data: Data validation tests
    notebook: Notebook execution tests
    performance: Performance tests
    security: Security tests
    smoke: Smoke tests for CI
    regression: Snapshot/bug-regression tests
    concurrent: Concurrent execution tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*
    */migrations/*
    */config/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

precision = 2
show_missing = True

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
