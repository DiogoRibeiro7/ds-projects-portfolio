name: Global Supply Chain ICIO Probe

on:
  pull_request:
    paths:
      - "projects/global_supply_chain_resilience/**"
      - ".github/workflows/global-supply-chain-icio-probe.yml"
  workflow_dispatch:

jobs:
  test-and-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/global_supply_chain_resilience

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Probe official OECD 2022 ICIO table
        run: python scripts/probe_oecd_icio.py --output-dir artifacts/icio_probe

      - name: Audit official ICIO balance history
        run: >-
          python scripts/audit_icio_balance_history.py
          --archive artifacts/icio_probe/2016-2022_SML.zip
          --output artifacts/icio_probe/icio_2016_2022_balance_audit.json

      - name: Build validated 2022 production graph
        run: >-
          python scripts/build_2022_network.py
          --archive artifacts/icio_probe/2016-2022_SML.zip
          --diagnostics-output artifacts/icio_probe/icio_2022_accounting_diagnostics.json
          --output artifacts/icio_probe/icio_2022_network.json

      - name: Compute 2022 structural dependency baseline
        run: >-
          python scripts/analyze_2022_dependency.py
          --archive artifacts/icio_probe/2016-2022_SML.zip
          --csv-output artifacts/icio_probe/icio_2022_dependency_metrics.csv
          --summary-output artifacts/icio_probe/icio_2022_dependency_summary.json

      - name: Audit dependency ranking stability
        run: >-
          python scripts/analyse_dependency_sensitivity.py
          --archive artifacts/icio_probe/2016-2022_SML.zip
          --output artifacts/icio_probe/icio_2022_dependency_sensitivity.json

      - name: Audit supplier-side importance
        run: >-
          python scripts/analyze_2022_supplier_importance.py
          --archive artifacts/icio_probe/2016-2022_SML.zip
          --csv-output artifacts/icio_probe/icio_2022_supplier_importance.csv
          --summary-output artifacts/icio_probe/icio_2022_supplier_importance_summary.json

      - name: Freeze threshold-persistent supplier candidates
        run: >-
          python scripts/freeze_supplier_shock_candidates.py
          --archive artifacts/icio_probe/2016-2022_SML.zip
          --output artifacts/icio_probe/icio_2022_supplier_shock_candidates.json

      - name: Upload empirical ICIO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-supply-chain-icio-2022-evidence
          path: |
            projects/global_supply_chain_resilience/artifacts/icio_probe/icio_2022_schema.json
            projects/global_supply_chain_resilience/artifacts/icio_probe/icio_2016_2022_balance_audit.json
            projects/global_supply_chain_resilience/artifacts/icio_probe/icio_2022_accounting_diagnostics.json
            projects/global_supply_chain_resilience/artifacts/icio_probe/icio_2022_network.json
            projects/global_supply_chain_resilience/artifacts/icio_probe/icio_2022_dependency_metrics.csv
            projects/global_supply_chain_resilience/artifacts/icio_probe/icio_2022_dependency_summary.json
            projects/global_supply_chain_resilience/artifacts/icio_probe/icio_2022_dependency_sensitivity.json
            projects/global_supply_chain_resilience/artifacts/icio_probe/icio_2022_supplier_importance.csv
            projects/global_supply_chain_resilience/artifacts/icio_probe/icio_2022_supplier_importance_summary.json
            projects/global_supply_chain_resilience/artifacts/icio_probe/icio_2022_supplier_shock_candidates.json
          if-no-files-found: warn
          retention-days: 30
