name: Advanced Customer Segmentation CI

on:
  push:
    paths:
      - 'projects/advanced_customer_segmentation/**'
      - '.github/workflows/advanced_customer_segmentation.yml'
  pull_request:
    paths:
      - 'projects/advanced_customer_segmentation/**'
      - '.github/workflows/advanced_customer_segmentation.yml'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib shap streamlit plotly pytest
      - name: Run tests
        run: |
          pytest projects/advanced_customer_segmentation/tests
