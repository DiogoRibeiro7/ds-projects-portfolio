[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experimentation-toolkit"
version = "0.1.0"
description = "Reusable A/B testing and experimentation utilities."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diogo Ribeiro" }]
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pandas-stubs>=2.0",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/experimentation_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
