name: Adaptive Policy Learning Study 3 Training Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "projects/adaptive_policy_learning/protocol/study3_training_qualification_trigger_v2_5.txt"

jobs:
  qualify-study3-training:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: projects/adaptive_policy_learning

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src

      - name: Download official ZOZO Open Bandit Dataset
        run: >-
          curl --fail --location --retry 3
          --output open_bandit_dataset.zip
          https://research.zozo.com/data_release/open_bandit_dataset.zip

      - name: Verify archive against frozen source lock
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          archive = Path("open_bandit_dataset.zip")
          source_lock = json.loads(Path("protocol/study3_selected_source_lock_v2_2.json").read_text())
          expected = str(source_lock["archive"]["sha256"])
          with archive.open("rb") as handle:
              actual = hashlib.file_digest(handle, "sha256").hexdigest()
          if actual != expected:
              raise SystemExit(f"archive SHA256 mismatch: expected {expected}, got {actual}")
          print(f"verified archive SHA256 {actual}")
          PY

      - name: Run frozen Study 3 training-only qualification
        run: >-
          python scripts/run_study3_training.py
          --archive open_bandit_dataset.zip
          --output artifacts/study3_training/study3_training_qualification.json
          --code-sha "${{ github.sha }}"

      - name: Upload Study 3 training qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-policy-learning-study3-training-qualification
          path: projects/adaptive_policy_learning/artifacts/study3_training/
          if-no-files-found: error
          retention-days: 30
