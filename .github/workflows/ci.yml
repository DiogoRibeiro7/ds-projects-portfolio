name: Portfolio Fast CI

on:
  push:
    branches:
      - main
      - "feature/*"
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "requirements*.txt"
      - "README.md"
      - "projects.yml"
      - "pyproject.toml"
      - "pytest.ini"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "requirements*.txt"
      - "README.md"
      - "projects.yml"
      - "pyproject.toml"
      - "pytest.ini"
      - "Makefile"
      - ".github/workflows/ci.yml"

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  fmt_lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ github.workspace }}/requirements-dev.txt
      - name: Install dependencies
        run: |
          if [ -f "${{ github.workspace }}/requirements-dev.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements-dev.txt"
          else
            echo "requirements-dev.txt not found; falling back to requirements.txt"
            pip install -r "${{ github.workspace }}/requirements.txt"
          fi
          python -m pip install ruff==0.14.0
          python -m pip install hypothesis
      - name: Collect changed Python files
        id: changed_python
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.base_ref || 'main' }}"
            git fetch origin "$base_ref" --depth=1
            base="origin/${base_ref}"
          else
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD^"
            fi
          fi
          files="$(git diff --diff-filter=ACMRT --name-only "$base"...HEAD -- '*.py' || true)"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Check formatting consistency
        if: steps.changed_python.outputs.files != ''
        shell: bash
        run: |
          cat > /tmp/changed-python.txt <<'EOF'
          ${{ steps.changed_python.outputs.files }}
          EOF
          xargs -r ruff format --check < /tmp/changed-python.txt
      - name: Lint
        if: steps.changed_python.outputs.files != ''
        shell: bash
        run: |
          cat > /tmp/changed-python.txt <<'EOF'
          ${{ steps.changed_python.outputs.files }}
          EOF
          xargs -r ruff check < /tmp/changed-python.txt
      - name: Validate project catalogue
        shell: bash
        run: |
          python - <<'PY'
          import pathlib

          import yaml

          path = pathlib.Path("projects.yml")
          if not path.exists():
              raise SystemExit("projects.yml is missing")

          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          projects = data.get("projects", []) if isinstance(data, dict) else []
          required = {"name", "repository", "status", "category", "summary"}
          missing = [
              project.get("name", "<missing name>")
              for project in projects
              if not isinstance(project, dict) or not required.issubset(project)
          ]
          def is_remote_repository(value):
              return value.startswith(("https://", "http://", "git@"))

          missing_repositories = [
              project["repository"]
              for project in projects
              if isinstance(project, dict)
              and isinstance(project.get("repository"), str)
              and not is_remote_repository(project["repository"])
              and not pathlib.Path(project["repository"]).exists()
          ]
          if not projects:
              raise SystemExit("projects.yml contains no projects")
          if missing:
              raise SystemExit(f"projects.yml entries missing required fields: {missing}")
          if missing_repositories:
              raise SystemExit(f"projects.yml repositories do not exist: {missing_repositories}")
          print(f"projects.yml valid: {len(projects)} projects")
          PY

  typecheck:
    name: Type Checking
    needs: fmt_lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ github.workspace }}/requirements-dev.txt
      - name: Install dependencies
        run: |
          if [ -f "${{ github.workspace }}/requirements-dev.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements-dev.txt"
          else
            echo "requirements-dev.txt not found; falling back to requirements.txt"
            pip install -r "${{ github.workspace }}/requirements.txt"
          fi
          python -m pip install ruff==0.14.0
      - name: Run mypy
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.base_ref || 'main' }}"
            git fetch origin "$base_ref" --depth=1
            base="origin/${base_ref}"
          else
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD^"
            fi
          fi

          files="$(git diff --diff-filter=ACMRT --name-only "$base"...HEAD -- '*.py' | grep -Ev '^(docs/)' || true)"
          if [ -z "$files" ]; then
            echo "No changed Python files to type-check."
            exit 0
          fi

          echo "$files" > /tmp/root-python.txt
          xargs -r mypy --ignore-missing-imports < /tmp/root-python.txt

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ github.workspace }}/requirements-dev.txt
      - name: Install dependencies
        run: |
          if [ -f "${{ github.workspace }}/requirements-dev.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements-dev.txt"
          else
            echo "requirements-dev.txt not found; falling back to requirements.txt"
            pip install -r "${{ github.workspace }}/requirements.txt"
          fi
          python -m pip install ruff==0.14.0
      - name: Run tests
        env:
          PYTHONHASHSEED: "0"
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.base_ref || 'main' }}"
            git fetch origin "$base_ref" --depth=1
            base="origin/${base_ref}"
          else
            base="${{ github.event.before }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD^"
            fi
          fi

          changed="$(git diff --diff-filter=ACMRT --name-only "$base"...HEAD)"
          mkdir -p artifacts

          changed_test_surface="$(echo "$changed" | grep -E '^(src|tests)/' || true)"
          non_notebook_surface="$(echo "$changed_test_surface" | grep -Ev '^tests/notebook_tests/' || true)"

          if [ -n "$non_notebook_surface" ]; then
            make test TEST_OPTS="--junitxml=artifacts/junit-${{ matrix.python-version }}.xml --durations=25 --cov=src --cov-report=xml:artifacts/coverage-${{ matrix.python-version }}.xml --cov-report=term-missing:skip-covered"
          fi

          if [ -z "$non_notebook_surface" ] && echo "$changed" | grep -Eq '^tests/notebook_tests/'; then
            python -m pip install papermill nbformat nbconvert memory_profiler psutil
            python scripts/run_notebook_tests.py \
              --validate-only \
              --dirs projects/ab_testing \
              --output test_results_ci
          fi

          if [ -z "$changed_test_surface" ]; then
            echo "No changed Python test surface."
          fi
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-artifacts-${{ matrix.python-version }}
          path: artifacts
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: artifacts/coverage-${{ matrix.python-version }}.xml

  docs:
    name: Docs Build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ github.workspace }}/requirements-dev.txt
      - name: Install dependencies
        run: |
          if [ -f "${{ github.workspace }}/requirements-dev.txt" ]; then
            pip install -r "${{ github.workspace }}/requirements-dev.txt"
          else
            echo "requirements-dev.txt not found; falling back to requirements.txt"
            pip install -r "${{ github.workspace }}/requirements.txt"
          fi
          python -m pip install ruff==0.14.0
      - name: Validate docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path("README.md"),
              Path("projects.yml"),
              Path("docs/architecture.md"),
              Path("docs/index.md"),
              Path("docs/PORTFOLIO_SCOPE.md"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          empty = [str(path) for path in required if path.exists() and not path.read_text(encoding="utf-8").strip()]
          if missing:
              raise SystemExit(f"Required docs missing: {missing}")
          if empty:
              raise SystemExit(f"Required docs empty: {empty}")
          print(f"Validated {len(required)} documentation files")
          PY
      - name: Upload docs build on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: docs/_build
